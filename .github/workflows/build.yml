name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pymupdf pillow pywin32 pyinstaller

    - name: Build Standalone EXE
      run: |
        pyinstaller --noconsole --onefile --name "PVC_Photo_Studio" xerox.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: PVC_Photo_Studio_Windows_EXE
        path: dist/PVC_Photo_Studio.exe
